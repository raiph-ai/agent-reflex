[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-reflex"
version = "0.2.0"
description = "Typed decision layer for autonomous agents"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Red Circle Studio"}]
keywords = ["ai-agents", "hermes-agent", "decision-routing", "agentops", "structured-output"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
]

[project.scripts]
agent-reflex = "agent_reflex.cli:main"
agent-reflex-web = "agent_reflex.web:main"
agent-reflex-hermes-install = "agent_reflex.hermes.install:main"

[tool.setuptools.packages.find]
include = ["agent_reflex*"]

[tool.setuptools.package-data]
agent_reflex = ["hermes/skills/agent-reflex/SKILL.md"]
